<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Space Grotesk"; font-weight: 300 700; src: url("assets/fonts/space-grotesk-latin.woff2") format("woff2"); }
@font-face { font-family: "Poppins"; font-weight: 400; src: url("assets/fonts/poppins-400-latin.woff2") format("woff2"); }
* { margin: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; position: relative; font-family: "Poppins", sans-serif; background: #1a202c; }
.photo { position: absolute; inset: 0; }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.shade { position: absolute; inset: 0; background:
  linear-gradient(to bottom, rgba(15,18,24,.38) 0%, rgba(15,18,24,0) 30%),
  linear-gradient(to top, rgba(15,18,24,.82) 0%, rgba(15,18,24,.25) 52%, rgba(15,18,24,0) 75%); }
.wrap { position: absolute; inset: 0; padding: 54px 64px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; }
.lockup { font-family: "Space Grotesk"; font-weight: 700; font-size: 40px; letter-spacing: .01em; }
.lockup small { display: block; font-size: 15px; font-weight: 500; letter-spacing: .34em; margin-top: 2px; }
h1 { font-family: "Space Grotesk"; font-weight: 700; font-size: 88px; line-height: 1.02; letter-spacing: -0.02em; }
.rule { width: 64px; height: 4px; background: #fe6601; border-radius: 2px; margin: 22px 0 18px; }
.sub { font-size: 24px; color: rgba(255,255,255,.92); }
</style>
</head>
<body>
<div class="photo"><img src="assets/img/hero.jpg" alt=""></div>
<div class="shade"></div>
<div class="wrap">
  <div class="lockup">MACHO!<small>SCOOTERS &amp; CARS</small></div>
  <div>
    <h1>Het eiland<br>is van jou.</h1>
    <div class="rule"></div>
    <p class="sub">Scooters &amp; auto’s op Bonaire · vanaf $21,50 per dag</p>
  </div>
</div>
</body>
</html>
